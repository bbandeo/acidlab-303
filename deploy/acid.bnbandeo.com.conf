# Plantilla nginx para acid.bnbandeo.com -> app TD-3 (pm2: td3-web en 127.0.0.1:4173).
# Instalación (requiere sudo):
#   sudo cp deploy/acid.bnbandeo.com.conf /etc/nginx/sites-available/acid.bnbandeo.com
#   sudo ln -s /etc/nginx/sites-available/acid.bnbandeo.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d acid.bnbandeo.com   # reescribe el archivo y agrega TLS; no volver a copiar esta plantilla encima.
# Requiere un registro DNS A/AAAA de acid.bnbandeo.com apuntando a este servidor.

server {
    listen 80;
    listen [::]:80;
    server_name acid.bnbandeo.com;

    access_log /var/log/nginx/acid-access.log;
    error_log /var/log/nginx/acid-error.log;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
